name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildId:
        required: true
      webhookUrl:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ═══════════════════════════════════════════════════════════════
      # 1. Checkout
      # ═══════════════════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Received
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Received job"
          STEP_INDEX: "1"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 2. Environment setup
      # ═══════════════════════════════════════════════════════════════
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
          sdkmanager --version || true

      - name: Install Android build tools
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Notify SDK ready
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Android SDK ready"
          STEP_INDEX: "2"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 3. Fetch config + ZIP from backend
      # ═══════════════════════════════════════════════════════════════
      - name: Fetch full config from backend
        env:
          BUILD_ID: ${{ github.event.inputs.buildId }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -sS -f \
            -H "X-Internal-Secret: $WEBHOOK_SECRET" \
            "$BACKEND_URL/api/internal/config/$BUILD_ID" \
            -o config-response.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('config-response.json','utf8'));if(!d.config)throw new Error('No config');fs.writeFileSync('config.json',JSON.stringify(d.config,null,2));console.log('config.json written');"

      - name: Fetch offline ZIP (if any)
        env:
          BUILD_ID: ${{ github.event.inputs.buildId }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if curl -sS -f \
               -H "X-Internal-Secret: $WEBHOOK_SECRET" \
               "$BACKEND_URL/api/internal/zip/$BUILD_ID" \
               -o zip-response.json; then
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('zip-response.json','utf8'));fs.writeFileSync('offline.zip.b64', d.base64 || '');console.log('Offline ZIP:', Math.round((d.size||0)/1024), 'KB');"
          else
            echo "No offline ZIP for this build"
            : > offline.zip.b64
          fi

      - name: Notify config fetched
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Configuration loaded"
          STEP_INDEX: "3"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 4. Reset flags + SCAN modules (metadata only)
      # ═══════════════════════════════════════════════════════════════
      - name: Reset module flags
        run: rm -f module-flags.json || true

      # ⭐ SCAN phase — reads module.json from each module,
      # writes module-flags.json (used by generate-project.js)
      - name: Scan custom modules
        env:
          BUILD_ID: ${{ github.event.inputs.buildId }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          npm install --no-save node-fetch@2
          node scripts/install-custom-modules.js "$BUILD_ID" scan

      # ═══════════════════════════════════════════════════════════════
      # 5. Generate Android project (reads module-flags.json)
      # ═══════════════════════════════════════════════════════════════
      - name: Generate Android project
        run: node scripts/generate-project.js config.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Notify project generated
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Android project generated"
          STEP_INDEX: "4"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 6. INSTALL modules (Kotlin, layouts, deps into generated project)
      # ═══════════════════════════════════════════════════════════════
      # ⭐ INSTALL phase — extracts full module ZIPs into android-project/
      - name: Install custom modules
        env:
          BUILD_ID: ${{ github.event.inputs.buildId }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node scripts/install-custom-modules.js "$BUILD_ID"

      # ═══════════════════════════════════════════════════════════════
      # 7. Build APK
      # ═══════════════════════════════════════════════════════════════
      - name: Build APK
        working-directory: android-project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Notify APK built
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "APK compiled"
          STEP_INDEX: "5"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 8. Sign APK
      # ═══════════════════════════════════════════════════════════════
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          UNSIGNED=$(find android-project/app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "Unsigned APK: $UNSIGNED"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$UNSIGNED" app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-signed.apk \
            app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify app-signed.apk
          ls -la app-signed.apk

      - name: Notify signed
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "APK signed"
          STEP_INDEX: "6"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 9. Upload to GitHub Releases
      # ═══════════════════════════════════════════════════════════════
      - name: Upload to GitHub Releases
        id: upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          APK_URL=$(node scripts/upload-to-github-release.js app-signed.apk "${{ github.event.inputs.buildId }}" | tail -n1)
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded to: $APK_URL"

      - name: Notify uploaded
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Uploaded to GitHub Releases"
          STEP_INDEX: "7"
        run: node scripts/notify-step.js

      # ═══════════════════════════════════════════════════════════════
      # 10. Notify completed / failed
      # ═══════════════════════════════════════════════════════════════
      - name: Notify completed
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          APK_URL: ${{ steps.upload.outputs.apk_url }}
        run: node scripts/notify-webhook.js completed

      - name: Notify failed
        if: failure()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
        run: node scripts/notify-webhook.js failed "Build failed. Check GitHub Actions logs."
