name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "Unique build ID"
        required: true
      webhookUrl:
        description: "Webhook callback URL"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Notify Received
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Received job"
          STEP_INDEX: "1"
        run: node scripts/notify-step.js

      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Checked out
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Checked out repository"
          STEP_INDEX: "2"
        run: node scripts/notify-step.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Notify Node ready
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Node.js 20 ready"
          STEP_INDEX: "3"
        run: node scripts/notify-step.js

      - name: Install worker deps
        run: npm install --no-save node-fetch@2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Notify Java ready
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Java 17 ready"
          STEP_INDEX: "4"
        run: node scripts/notify-step.js

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
          sdkmanager --version || true

      - name: Notify Android SDK ready
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Android SDK ready"
          STEP_INDEX: "5"
        run: node scripts/notify-step.js

      - name: Install Android build tools
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Notify build tools ready
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Android build tools installed"
          STEP_INDEX: "6"
        run: node scripts/notify-step.js

      - name: Fetch full config from backend
        env:
          BUILD_ID: ${{ github.event.inputs.buildId }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -sS -f \
            -H "X-Internal-Secret: $WEBHOOK_SECRET" \
            "$BACKEND_URL/api/internal/config/$BUILD_ID" \
            -o config-response.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('config-response.json','utf8'));if(!data.config)throw new Error('No config');fs.writeFileSync('config.json',JSON.stringify(data.config,null,2));"

      - name: Notify config fetched
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Configuration loaded"
          STEP_INDEX: "7"
        run: node scripts/notify-step.js

      - name: Generate Android project
        run: node scripts/generate-project.js config.json

      - name: Notify project generated
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Android project generated"
          STEP_INDEX: "8"
        run: node scripts/notify-step.js

      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Notify APK built
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "APK compiled with Gradle"
          STEP_INDEX: "9"
        run: node scripts/notify-step.js

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          UNSIGNED=$(find android-project/app/build/outputs/apk/release -name "*.apk" | head -n1)
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/zipalign -v -p 4 "$UNSIGNED" app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-signed.apk \
            app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify app-signed.apk

      - name: Notify signed
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "APK signed with keystore"
          STEP_INDEX: "10"
        run: node scripts/notify-step.js

      - name: Upload to GitHub Releases
        id: upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          APK_URL=$(node scripts/upload-to-github-release.js app-signed.apk "${{ github.event.inputs.buildId }}" | tail -n1)
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Notify uploaded
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          STEP_NAME: "Uploaded to GitHub Releases"
          STEP_INDEX: "11"
        run: node scripts/notify-step.js

      - name: Notify completed
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
          APK_URL: ${{ steps.upload.outputs.apk_url }}
        run: node scripts/notify-webhook.js completed

      - name: Notify failed
        if: failure()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID: ${{ github.event.inputs.buildId }}
          WEBHOOK_URL: ${{ github.event.inputs.webhookUrl }}
        run: node scripts/notify-webhook.js failed "Build failed. Check GitHub Actions logs."
