name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildId:
        required: true
      webhookUrl:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install worker deps
        run: npm install --no-save node-fetch@2

      - name: Setup Java
        uses: actions/setup-java@v5          # ← v4 থেকে v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |                                # ← action বাদ, direct command
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
          sdkmanager --version

      - name: Install Android build tools
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      # ... বাকি step গুলো same থাকবে ...
